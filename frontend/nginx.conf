# nginx.conf

server {
    # 1. Listen on standard HTTP web port inside the container
    listen 80;
    server_name _;

    # 2. Where the React "bento-box" static files live
    root /usr/share/nginx/html;
    index index.html;

    # 3. ROUTE A: Handle Frontend Requests (React)
    # Whenever someone visits the main site (e.g., ://example.com)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 4. ROUTE B: Handle Backend Requests (Flask Reverse Proxy)
    # Whenever the browser requests anything starting with /api/
    location /api/ {
        # Secretly forward the request to Flask using its Docker network nickname
        proxy_pass http://roastcart-backend:5000;
        
        # Pass along important browser headers so Flask knows who the original user is
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
