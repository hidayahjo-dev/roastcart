services:
  postgres-db:
    image: postgres:15-alpine
    container_name: roastcart_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - roastcart_postgres_data:/var/lib/postgresql/data

volumes:
  roastcart_postgres_data:
