# Docker compose:
# describes how to run multiple containers together
# on the shared default network

services:
  # 1. Database Tier (Uses official pre-built image)
  postgres-db: # service key name --> used by Docker for internal service discovery and DNS routing b/w containers
    image: postgres:15-alpine
    container_name: roastcart_db # this is human-readable container name for running commands in terminal
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - roastcart_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Application Tier (Builds your custom Flask code)
  roastcart-backend:
    build:
      context: ./backend # -> context: files Docker can see during the build
      dockerfile: Dockerfile.prod # -> instructions Docker can use

    container_name: roastcart_flask_backend
    restart: unless-stopped
    ports:
      # format-> HOST:CONTAINER
      - "5000:5000"

    env_file:
      - .env

    environment:
      FLASK_DEBUG: "0"
      # CRUCIAL DEVOPS CONCEPT:
      # Inside Docker, use the Compose service name
      # instead of localhost.
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@postgres-db:5432/${DB_NAME}
    depends_on:
      postgres-db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  roastcart-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod

    container_name: roastcart_react_frontend
    restart: unless-stopped

    ports:
      # HOST:CONTAINER
      # Browser -> localhost:3000 -> Nginx:80
      - "3000:80"
    depends_on:
      roastcart-backend:
        condition: service_healthy

volumes:
  roastcart_postgres_data:
